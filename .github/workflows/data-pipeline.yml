name: Data Pipeline

on:
  schedule:
    # Runs daily at 03:30 UTC (09:00 IST) - after the Databricks cleansing job
    - cron: "30 3 * * *"
  workflow_dispatch: {} # allows manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"

# Required for the "Commit refreshed datasets back to repo" step below.
# Without this, the default GITHUB_TOKEN is read-only and `git push` fails
# with a 403, even if your repo's own Settings allow it -- both need to agree.
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite and save report (for evidence + snapshot bundling)
        run: |
          python -m pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v \
            | tee test-report.txt

      - name: Run full pipeline (generate -> clean -> forecast -> recommend -> export -> snapshot)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        run: |
          python -m src.pipeline.run_pipeline

      - name: Find today's dated snapshot folder
        id: snapshot
        run: |
          FOLDER=$(ls -d "runs/S3-P-07 - "* | tail -n 1)
          FOLDER_NAME=$(basename "$FOLDER")
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "folder_name=$FOLDER_NAME" >> "$GITHUB_OUTPUT"
          echo "Snapshot folder: $FOLDER (artifact name: $FOLDER_NAME)"

      - name: Upload dated snapshot (data + test report) as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.snapshot.outputs.folder_name }}
          path: ${{ steps.snapshot.outputs.folder }}
          retention-days: 30

      - name: Commit refreshed Power BI datasets back to repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/powerbi/*.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh Power BI datasets [automated]"
          git push
