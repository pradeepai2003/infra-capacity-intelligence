topic_id: "S3-P-07"

data_generation:
  start_date: "2025-01-01"
  num_days: 365
  num_macs: 8
  resource_types: ["cpu", "ram", "disk"]
  random_seed: 42
  # Synthetic project each Mac is primarily running -- used for narrative context
  # in recommendations (e.g. "Mac-03, running Project Falcon, is over-allocated").
  project_pool:
    - "Project Atlas"
    - "Project Nova"
    - "Project Orion"
    - "Project Zephyr"
    - "Project Falcon"
    - "Project Comet"
    - "Project Vega"
    - "Project Lumen"

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  seeded_scenarios_dir: "data/seeded_scenarios"
  powerbi_export_dir: "src/powerbi"
  snapshot_dir: "runs"
  onedrive_dir: ""
  test_report_file: "test-report.txt"
  coverage_xml_file: "coverage.xml"

forecasting:
  horizons_weeks: [4, 12]
  models:
    - linear_regression
    - prophet

thresholds:
  # Per-Mac, per-resource-type thresholds (a Mac is "overloaded" on a resource
  # above this, "underloaded"/over-allocated below this)
  overloaded_utilization_pct: 85
  underloaded_utilization_pct: 30
  # How far a Mac's utilization can deviate from the 8-Mac fleet average
  # (for a given resource type) before it's flagged for rebalancing
  equalization_deviation_pct: 20

recommendation_engine:
  provider: "gemini"
  gemini_model: "gemini-1.5-flash"
  ollama_model: "llama3"
  ollama_host: "http://localhost:11434"

seeded_scenarios:
  - capacity_shortfall
  - chronic_waste
  - seasonal_spike
